id: dbt_build
namespace: nyc_taxi
description: |
  Transformaciones con dbt: Bronze -> Silver -> Gold + tests.
  Lo llama ingest_yellow_all como último paso (también se puede lanzar a mano).
  El proyecto dbt se monta en el contenedor de Kestra en /app/dbt (ver docker-compose.yml).
  Idempotente: Bronze/Silver son incrementales por archivo y Gold se reconstruye completo.

tasks:
  - id: dbt
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: copy_project
        type: io.kestra.plugin.scripts.shell.Commands
        # corre dentro del contenedor de Kestra, donde está montado /app/dbt
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        commands:
          - cp -r /app/dbt/. .
          - rm -rf target dbt_packages logs .user.yml

      - id: dbt_build
        type: io.kestra.plugin.dbt.cli.DbtCLI
        # imagen fija (digest) con la que se probó la tubería
        containerImage: ghcr.io/kestra-io/dbt-snowflake@sha256:2f67fa1438333ab2532df854697b05099f671bf041a37d9e9bc47a872eac69fc
        env:
          SNOWFLAKE_ACCOUNT: "{{ envs.snowflake_account }}"
          SNOWFLAKE_USER: "{{ envs.snowflake_user }}"
          SNOWFLAKE_PASSWORD: "{{ envs.snowflake_password }}"
          SNOWFLAKE_ROLE: "{{ envs.snowflake_role }}"
          SNOWFLAKE_WAREHOUSE: "{{ envs.snowflake_warehouse }}"
          SNOWFLAKE_DATABASE: "{{ envs.snowflake_database }}"
        commands:
          - dbt deps --profiles-dir .
          - dbt build --profiles-dir .
