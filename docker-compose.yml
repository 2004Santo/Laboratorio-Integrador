volumes:
  postgres-data:
  kestra-data:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kestra:
    # versión fija: la tubería está probada con Kestra 2.0.3
    image: kestra/kestra:v2.0.3
    restart: unless-stopped
    user: "root"
    command: server standalone
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./kestra/flows:/app/flows:ro
      - ./dbt:/app/dbt:ro
    environment:
      ENV_SNOWFLAKE_ADMIN_USER: ${SNOWFLAKE_ADMIN_USER}
      ENV_SNOWFLAKE_ADMIN_PASSWORD: ${SNOWFLAKE_ADMIN_PASSWORD}
      ENV_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      ENV_SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      ENV_SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      ENV_SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      ENV_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      ENV_SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      ENV_SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      KESTRA_CONFIGURATION: |
        micronaut:
          io:
            watch:
              enabled: true
              paths:
                - /app/flows
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
            driverClassName: org.postgresql.Driver
            username: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
        kestra:
          tutorial-flows:
            enabled: false
          server:
            basicAuth:
              enabled: true
              username: ${KESTRA_ADMIN_USER}
              password: ${KESTRA_ADMIN_PASSWORD}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
